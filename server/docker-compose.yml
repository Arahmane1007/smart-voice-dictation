services:
  svd-server:
    image: ghcr.io/${GITHUB_OWNER:-your-github-account}/smart-voice-dictation-server:latest
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      API_KEYS: ${API_KEYS:?Set API_KEYS (generate one with `svd-server generate-key`)}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-5}
      CPU_THREADS: ${CPU_THREADS:-0}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      MAX_AUDIO_SECONDS: ${MAX_AUDIO_SECONDS:-125}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      AUTH_FAILURES_PER_MINUTE: ${AUTH_FAILURES_PER_MINUTE:-10}
      QUEUE_SIZE: ${QUEUE_SIZE:-2}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - svd-models:/home/svd/.cache/huggingface
    restart: unless-stopped

volumes:
  svd-models:
